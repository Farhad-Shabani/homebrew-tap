name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    name: Cask
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
      - run: brew test-bot --only-tap-syntax
      - run: brew audit --cask --strict --online farhad-shabani/tap/aria
      - run: brew install --cask farhad-shabani/tap/aria
      # Notarized, and signed by Aria's team.
      - run: |
          set -euo pipefail
          assessment=$(spctl --assess --type execute -vv /Applications/Aria.app 2>&1)
          echo "$assessment"
          grep -q 'origin=Developer ID Application: .* (U72MF982D2)' <<< "$assessment"
      - run: aria --version
      - run: brew uninstall --cask aria
